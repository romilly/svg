[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "romilly-svg"
version = "0.1.0"
description = "A simple Python package for generating SVG documents"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]
include = ["svg*"]
